<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HEXForge — Visual PyTorch model builder, profiler, and ONNX exporter">
    <title>{% block title %}HEXForge{% endblock %}</title>
    <link favicon="{{ url_for('static', filename='uploads/logo-removebg.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
    <script>
        (function() {
            var sidebarState = localStorage.getItem('sidebar-state') || 'expanded';
            if (sidebarState === 'collapsed') {
                document.documentElement.classList.add('nav-collapsed');
            }
        })();
    </script>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="{{ url_for('main.dashboard') }}" class="sidebar-brand">
                <img src="{{ url_for('static', filename='logo-removebg.png') }}" alt="HEX Logo" class="logo-img">
                <span class="logo-text">HexForge</span>
            </a>
            <button id="sidebar-toggle-btn" class="nav-toggle-btn" title="Toggle Sidebar">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
        </div>

        <ul class="sidebar-menu">
            <li><a href="{{ url_for('main.dashboard') }}" {% if request.endpoint=='main.dashboard' %}class="active"{% endif %} title="Dashboard">
                <i class="fa-solid fa-chart-simple"></i>
                <span class="sidebar-label">Dashboard</span>
            </a></li>
            <li><a href="{{ url_for('main.projects') }}" {% if request.endpoint=='main.projects' %}class="active"{% endif %} title="Projects">
                <i class="fa-solid fa-folder-open"></i>
                <span class="sidebar-label">Projects</span>
            </a></li>
            <li><a href="{{ url_for('main.editor') }}" {% if request.endpoint=='main.editor' %}class="active"{% endif %} title="Node Editor">
                <i class="fa-solid fa-network-wired"></i>
                <span class="sidebar-label">Node Editor</span>
            </a></li>
            <!-- <li><a href="{{ url_for('main.training') }}" {% if request.endpoint=='main.training' %}class="active"{% endif %} title="Training">
                <i class="fa-solid fa-dumbbell"></i>
                <span class="sidebar-label">Training</span>
            </a></li> -->
            <li><a href="{{ url_for('main.playground') }}" {% if request.endpoint=='main.playground' %}class="active"{% endif %} title="Playground">
                <i class="fa-solid fa-vial"></i>
                <span class="sidebar-label">Playground</span>
            </a></li>
        </ul>

        <div class="sidebar-footer">
            <!-- Theme Toggle -->
            <button id="theme-toggle" class="sidebar-footer-item" title="Toggle Theme">
                <i class="fa-solid fa-moon"></i>
                <span class="sidebar-label">Toggle Theme</span>
            </button>

            <!-- Info Button -->
            <button class="sidebar-footer-item" id="info-btn" title="Developer Info">
                <i class="fa-solid fa-circle-info"></i>
                <span class="sidebar-label">About Developer</span>
            </button>
        </div>
    </aside>

    <main class="page-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const infoBtn = document.getElementById('info-btn');
            const infoDropdown = document.getElementById('info-dropdown');
            const themeToggleBtn = document.getElementById('theme-toggle');
            const sidebar = document.getElementById('sidebar');
            const sidebarToggle = document.getElementById('sidebar-toggle-btn');

            // Sidebar collapse logic (persists via localStorage)
            const isCollapsed = document.documentElement.classList.contains('nav-collapsed');
            if (isCollapsed) {
                sidebar.classList.add('collapsed');
                const icon = sidebarToggle.querySelector('i');
                icon.className = 'fa-solid fa-chevron-right';
            }

            sidebarToggle.addEventListener('click', () => {
                const nowCollapsed = document.documentElement.classList.toggle('nav-collapsed');
                sidebar.classList.toggle('collapsed', nowCollapsed);
                const icon = sidebarToggle.querySelector('i');
                icon.className = nowCollapsed ? 'fa-solid fa-chevron-right' : 'fa-solid fa-chevron-left';
                localStorage.setItem('sidebar-state', nowCollapsed ? 'collapsed' : 'expanded');
                // Trigger window resize event to let LiteGraph canvas resize itself smoothly
                window.dispatchEvent(new Event('resize'));
            });

            // Info Modal Dialog trigger
            infoBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                showCustomAlert({
                    title: 'Developer Information',
                    message: `
                        <div style="text-align: center; margin-bottom: 16px;">
                            <div style="font-size: 32px; color: var(--accent); margin-bottom: 8px;"><i class="fa-solid fa-code"></i></div>
                            <h4 style="margin: 0; font-size: 16px; font-weight: 600; color: var(--text-primary);">Het Vaghani</h4>
                            <p style="margin: 4px 0 0; font-size: 12px; color: var(--text-secondary);">AI / ML Developer</p>
                        </div>
                        <div class="dropdown-links-list" style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border-subtle); padding-top: 16px;">
                            <a href="https://github.com/vaghanihet2001" target="_blank" rel="noopener noreferrer" class="btn btn-ghost" style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; text-decoration: none; color: var(--text-primary); padding: 10px; border: 1px solid var(--border-subtle); border-radius: 6px; background: var(--bg-card);">
                                <i class="fa-brands fa-github" style="font-size: 16px; color: var(--accent);"></i> GitHub Profile
                            </a>
                            <a href="https://www.linkedin.com/in/ai-ml-developer" target="_blank" rel="noopener noreferrer" class="btn btn-ghost" style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; text-decoration: none; color: var(--text-primary); padding: 10px; border: 1px solid var(--border-subtle); border-radius: 6px; background: var(--bg-card);">
                                <i class="fa-brands fa-linkedin" style="font-size: 16px; color: var(--accent);"></i> LinkedIn Profile
                            </a>
                            <a href="mailto:vaghanihet2001@gmail.com" class="btn btn-ghost" style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; text-decoration: none; color: var(--text-primary); padding: 10px; border: 1px solid var(--border-subtle); border-radius: 6px; background: var(--bg-card);">
                                <i class="fa-solid fa-envelope" style="font-size: 16px; color: var(--accent);"></i> Email Developer
                            </a>
                            <a href="https://hexverce.in/" target="_blank" rel="noopener noreferrer" class="btn btn-ghost" style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; text-decoration: none; color: var(--text-primary); padding: 10px; border: 1px solid var(--border-subtle); border-radius: 6px; background: var(--bg-card);">
                                <i class="fa-solid fa-globe" style="font-size: 16px; color: var(--accent);"></i> HexVerce Website
                            </a>
                        </div>
                    `,
                    type: 'info',
                    confirmText: 'Close'
                });
            });

            // Theme toggle logic (persists via localStorage)
            let currentTheme = localStorage.getItem('app-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            updateThemeIcon(currentTheme);

            themeToggleBtn.addEventListener('click', () => {
                currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', currentTheme);
                localStorage.setItem('app-theme', currentTheme);
                updateThemeIcon(currentTheme);
                // Trigger event so iframe / canvas / LiteGraph can update if needed
                document.dispatchEvent(new CustomEvent('themeChanged', { detail: { theme: currentTheme } }));
            });

            function updateThemeIcon(theme) {
                const icon = themeToggleBtn.querySelector('i');
                if (theme === 'light') {
                    icon.className = 'fa-solid fa-sun';
                } else {
                    icon.className = 'fa-solid fa-moon';
                }
            }
        });
    </script>

    <!-- ====== CUSTOM DIALOG MODAL ====== -->
    <div class="result-overlay" id="custom-alert-overlay" style="z-index: 200000; background: rgba(4,6,15,0.75); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; position: fixed; inset: 0;">
      <div class="result-card" id="custom-alert-card" style="width: 440px; max-width: 90vw; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 24px; box-shadow: var(--shadow-md), var(--shadow-glow); display: flex; flex-direction: column;">
        <h3 id="custom-alert-title" style="margin: 0 0 12px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px;">
          <i class="fa-solid fa-circle-info"></i> Notification
        </h3>
        <div id="custom-alert-body" style="font-size: 13px; color: var(--text-primary); margin: 0 0 20px; line-height: 1.55; max-height: 75vh; overflow-y: auto; word-break: break-word; font-family: var(--font-sans);"></div>
        <div style="display: flex; justify-content: flex-end; gap: 8px; align-items: center;" id="custom-alert-footer">
          <button class="btn btn-primary" id="custom-alert-btn-close" style="padding: 6px 16px; font-size: 12px; min-width: 80px;">OK</button>
        </div>
      </div>
    </div>

    <script>
        function showCustomAlert(options) {
            const overlay = document.getElementById("custom-alert-overlay");
            const titleEl = document.getElementById("custom-alert-title");
            const bodyEl = document.getElementById("custom-alert-body");
            const cardEl = document.getElementById("custom-alert-card");
            const closeBtn = document.getElementById("custom-alert-btn-close");
            const footer = document.getElementById("custom-alert-footer");
            
            let cancelBtn = document.getElementById("custom-alert-btn-cancel");
            if (cancelBtn) cancelBtn.remove();

            if (options.message && options.message.trim().startsWith("<")) {
                bodyEl.innerHTML = options.message;
            } else {
                bodyEl.innerHTML = (options.message || "").replace(/\n/g, "<br>");
            }
            cardEl.style.borderLeft = "";
            titleEl.style.color = "";
            let iconHtml = '<i class="fa-solid fa-circle-info" style="color:var(--accent);"></i>';
            
            if (options.type === "error") {
                iconHtml = '<i class="fa-solid fa-circle-xmark" style="color:var(--red);"></i>';
                cardEl.style.borderLeft = "4px solid var(--red)";
                titleEl.style.color = "var(--red)";
            } else if (options.type === "success") {
                iconHtml = '<i class="fa-solid fa-circle-check" style="color:var(--green);"></i>';
                cardEl.style.borderLeft = "4px solid var(--green)";
                titleEl.style.color = "var(--green)";
            } else if (options.type === "warning") {
                iconHtml = '<i class="fa-solid fa-circle-exclamation" style="color:var(--yellow);"></i>';
                cardEl.style.borderLeft = "4px solid var(--yellow)";
                titleEl.style.color = "var(--yellow)";
            } else {
                iconHtml = '<i class="fa-solid fa-circle-info" style="color:var(--accent);"></i>';
                cardEl.style.borderLeft = "4px solid var(--accent)";
                titleEl.style.color = "var(--accent)";
            }
            
            titleEl.innerHTML = `${iconHtml} ${options.title || "Notification"}`;

            const cleanup = () => {
                overlay.style.display = "none";
                closeBtn.removeEventListener("click", onConfirm);
                if (cancelBtn) cancelBtn.removeEventListener("click", onCancel);
            };

            const onConfirm = () => {
                cleanup();
                if (typeof options.onConfirm === "function") options.onConfirm();
            };

            const onCancel = () => {
                cleanup();
                if (typeof options.onCancel === "function") options.onCancel();
            };

            closeBtn.addEventListener("click", onConfirm);
            closeBtn.textContent = options.confirmText || "OK";

            if (options.confirm) {
                cancelBtn = document.createElement("button");
                cancelBtn.id = "custom-alert-btn-cancel";
                cancelBtn.className = "btn btn-ghost";
                cancelBtn.style.cssText = "padding: 6px 16px; font-size: 12px; min-width: 80px;";
                cancelBtn.textContent = options.cancelText || "Cancel";
                cancelBtn.addEventListener("click", onCancel);
                footer.insertBefore(cancelBtn, closeBtn);
            }

            overlay.style.display = "flex";
        }

        window.customAlert = function(message, type = "info", title = "Notification") {
            showCustomAlert({ title: title, message: message, type: type, confirm: false });
        };

        window.customConfirm = function(message, onConfirm, onCancel, title = "Confirmation") {
            showCustomAlert({ title: title, message: message, type: "warning", confirm: true, onConfirm: onConfirm, onCancel: onCancel });
        };
    </script>

    {% block extra_js %}{% endblock %}

</body>
</html>
